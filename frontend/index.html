<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumia Kenya — No. 1 Shopping Site</title>
    <meta name="description" content="Shop online for electronics, fashion, home & garden and much more on Jumia Kenya" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* Critical CSS — prevent FOUC */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Nunito', sans-serif;
        background: #f5f5f5;
        color: #222;
      }
      #root { min-height: 100vh; }
      .app-loading {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; font-size: 1.2rem; color: #f68b1e;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <span>Loading Jumia...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
